name: SATGUARD Production CI Quality Gates

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-gate:
    name: Backend Regression & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gdal-bin libgdal-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Secret Leak Audit
        run: |
          echo "Scanning codebase for unencrypted private keys or raw passwords..."
          ! grep -rn "BEGIN PRIVATE KEY" satguard/ frontend/src/ || exit 1

      - name: Run Backend Regression Suite
        run: |
          python -m pytest tests/ -v --maxfail=1

  frontend-quality-gate:
    name: Frontend TypeScript & Production Build Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Run TypeScript Validation & Production Build
        run: npm run build
