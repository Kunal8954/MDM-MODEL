[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers -m "not live_data"
markers =
    live_data: Requires live satellite provider credentials (CDSE/Groq) and/or a
        database already populated by a real monitoring run. Deselected by default
        because their expected values are bound to one specific acquisition history
        and cannot be reproduced without network access and credentials.
filterwarnings =
    ignore::DeprecationWarning